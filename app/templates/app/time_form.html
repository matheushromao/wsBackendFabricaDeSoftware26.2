{% extends "app/base.html" %}

{% block titulo %}{{ titulo }} - Cartola Manager{% endblock %}

{% block conteudo %}
    <h1>{{ titulo }}</h1>

    <div class="card">
        <form method="post">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit">Salvar</button>
            <a href="{% url 'home' %}" class="btn btn-secundario">Cancelar</a>
        </form>
    </div>
{% endblock %}
