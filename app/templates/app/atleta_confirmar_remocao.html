{% extends "app/base.html" %}

{% block titulo %}Remover atleta - Cartola Manager{% endblock %}

{% block conteudo %}
    <h1>Remover atleta</h1>

    <div class="card">
        <p style="margin-bottom:20px;">
            Tem certeza que deseja remover <strong>{{ atleta.apelido }}</strong>
            ({{ atleta.clube }}) do seu time?
        </p>

        <form method="post">
            {% csrf_token %}
            <button type="submit">Sim, remover</button>
            <a href="{% url 'home' %}" class="btn btn-secundario">Cancelar</a>
        </form>
    </div>
{% endblock %}
